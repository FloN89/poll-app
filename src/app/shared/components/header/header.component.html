<header class="header" [class.header--light]="light">
  <a class="header__logo" routerLink="/">
    <img
      [src]="light ? '/assets/poll_app_logo_dark.png' : '/assets/poll_app_logo_light.png'"
      alt="Poll App"
    />
    <span>Poll<br />App</span>
  </a>

  @if (showCreateButton) {
    <button class="btn" type="button" (click)="createClicked.emit()">
      Create survey
    </button>
  }
</header>
